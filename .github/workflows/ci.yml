name: validate

on:
  push:
  pull_request:
  schedule:
    # 이 저장소는 큐레이션 항목의 ref를 추종한다. 업스트림이 브랜치를 지우거나
    # 저장소를 옮기면 우리가 아무것도 바꾸지 않아도 설치가 깨진다.
    # 주간 실행이 그걸 커밋 전에 알려주는 유일한 장치다.
    - cron: '0 0 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # V5 비밀 스캔이 전체 트리를 보게 한다

      # V1(claude plugin validate --strict)은 여기서 돌리지 않는다.
      # CLI가 200MB에 가깝고 인증을 요구할 수 있어 CI를 불안정하게 만든다.
      # V1은 릴리스 전 로컬 스모크 테스트에서 강제한다 (PRD 11장).
      - name: validate
        run: ./scripts/validate.sh --online
